[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "contra-clarification"
version = "0.1.0"
description = "Behavior-changing questions for selective clarification in code generation"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
dependencies = [
    "openai>=1.40,<3",
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
plugin = ["pytest>=8,<9"]

[tool.setuptools]
packages = ["contra"]

[tool.setuptools.package-dir]
contra = "code/pipeline/contra"
